services:
  - type: web
    name: lff-shopify-backend
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        value: 62b68f5e3b3a348d914e98db544f3bdd
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_customers,write_customers,read_price_rules,write_price_rules,read_discounts,write_discounts,read_draft_orders,write_draft_orders,read_inventory,read_metaobjects,write_metaobjects,read_orders,write_orders,read_products,write_app_proxy
      - key: DATABASE_URL
        value: file:./database.sqlite
